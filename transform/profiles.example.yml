# Copy to ~/.dbt/profiles.yml. Connection values come from environment
# variables; nothing secret is ever written into this file. Only
# SNOWFLAKE_ACCOUNT and SNOWFLAKE_DBT_PRIVATE_KEY_PASSPHRASE have no default.
# Authentication is key pair only: the encrypted PKCS#8 private key lives in
# ~/.snowflake/keys/ (chmod 600) and its passphrase comes from the environment.
ecommerce_analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_DBT_USER', 'DBT_SVC') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_DBT_PRIVATE_KEY_PATH', env_var('HOME') ~ '/.snowflake/keys/dbt_svc.p8') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_DBT_PRIVATE_KEY_PASSPHRASE') }}"
      role: "{{ env_var('SNOWFLAKE_DBT_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_DBT_WAREHOUSE', 'TRANSFORMING_WH') }}"
      database: "{{ env_var('SNOWFLAKE_ANALYTICS_DATABASE', 'ANALYTICS') }}"
      schema: "{{ env_var('SNOWFLAKE_DBT_SCHEMA', 'DEV') }}"
      threads: 4
      client_session_keep_alive: false

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_DBT_USER', 'DBT_SVC') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_DBT_PRIVATE_KEY_PATH', env_var('HOME') ~ '/.snowflake/keys/dbt_svc.p8') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_DBT_PRIVATE_KEY_PASSPHRASE') }}"
      role: "{{ env_var('SNOWFLAKE_DBT_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_DBT_WAREHOUSE', 'TRANSFORMING_WH') }}"
      database: "{{ env_var('SNOWFLAKE_ANALYTICS_DATABASE', 'ANALYTICS') }}"
      schema: ANALYTICS
      threads: 4
      client_session_keep_alive: false
