# DuckDB profile for CI and local runs on synthetic fixtures.
# It contains no secrets and never connects to Snowflake or BigQuery.
ecommerce_analytics:
  target: ci
  outputs:
    ci:
      type: duckdb
      # make targets set DBT_DUCKDB_PATH; linting compiles in memory.
      path: "{{ env_var('DBT_DUCKDB_PATH', ':memory:') }}"
      schema: ci
      threads: 4
