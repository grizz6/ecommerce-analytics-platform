name: ecommerce_analytics
version: "0.1.0"
config-version: 2
profile: ecommerce_analytics
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Business reporting timezone. Event timestamps stay in UTC; daily reporting
  # dates are derived in this timezone (US East Coast).
  reporting_timezone: America/New_York
