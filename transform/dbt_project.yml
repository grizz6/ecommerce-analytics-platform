name: ecommerce_analytics
version: "0.1.0"
config-version: 2
profile: ecommerce_analytics
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Business reporting time zone (US East Coast). Event timestamps stay in
  # UTC; reporting dates are derived in this time zone.
  reporting_timezone: America/New_York
  # The GA4 daily tables are UTC days, so the first and last East Coast dates
  # are partial. Daily KPIs, trends and retention use complete days only.
  first_complete_reporting_date: "2020-11-01"
  last_complete_reporting_date: "2021-01-30"
  # Incremental runs on Snowflake reprocess this many days before the latest
  # loaded GA4 date, so reloaded or late-arriving days are merged again.
  event_lookback_days: 3
  # Orders are attributed to the user's sessions in this many days before and
  # including the order.
  attribution_lookback_days: 30

models:
  ecommerce_analytics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      # BI-facing tables. Contracts make column names and types part of the
      # interface; every mart casts each column explicitly so the same
      # declared types hold on Snowflake and DuckDB.
      +schema: marts
      +materialized: table
      +contract:
        enforced: true

seeds:
  ecommerce_analytics:
    +schema: reference
    ga4_source_categories:
      +column_types:
        source: varchar
        source_category: varchar
