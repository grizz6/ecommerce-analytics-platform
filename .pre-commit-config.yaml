# Hook versions match the tool versions pinned in pyproject.toml.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # SQLFluff runs from the project environment so the dbt templater can
  # compile models exactly as dbt does. Needs `make setup` (dbt packages).
  - repo: local
    hooks:
      - id: sqlfluff-setup-scripts
        name: sqlfluff (Snowflake setup scripts)
        entry: uv run sqlfluff lint
        language: system
        files: ^infra/.*\.sql$
      - id: sqlfluff-dbt-models
        name: sqlfluff (dbt models)
        entry: uv run sqlfluff lint --templater dbt
        language: system
        files: ^transform/(models|tests|analyses)/.*\.sql$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
